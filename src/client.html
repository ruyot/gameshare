    <script>
        console.log("@#(*$U*@(3u9*#U()*u(U#984u(3u84093*U)(*#$()*$($#)))))")
        // Need to create a peerconnection for the client 
        
        // Create a config for the peerconnection
        const configuration = {
            iceServers: [{
                urls: "stun:stun.l.google.com:19302"
            }],
        };
         
        const pc = new RTCPeerConnection(configuration); 

        // Instantiate a websocket connection between the client (browser) and the server
        const socket = new WebSocket("ws://127.0.0.1:8080")

        // When the client presses a button eg join room and enters the id on the frontend they should be able to join
        const input = document.querySelector("input");

        input.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && input.value.trim() !== "") {
                event.preventDefault();
                const id = input.value;
                console.log(id);
                const join_room = `{"type":"Join","room_id":"${id}"}`;
                console.log(join_room);
                socket.send(join_room);
                input.value = "";
            }
        }); 
        
        socket.addEventListener("message", async (event) => {
            console.log(event.data)
            const {type, payload} = JSON.parse(event.data);
            console.log(type)
            console.log(payload)

            if (type === "Relay") {

                // start creating the answer here
                // reminder to convert the payload (offer) from string to RTCSessionDescription

                // Set the remote description with the offer
                await pc.setRemoteDescription(payload);
                
                console.log("set the remote description")

                // Create the answer
                const answer = await pc.createAnswer();
                
                console.log("created the answer")

                // Set the local description with the answer
                await pc.setLocalDesription(answer);

                console.log("set the local description")

                // do ice candidate stuff here
                const complete = false;

                pc.addEventListener("icegatheringstatechange", (event) => {
                    switch (pc.iceGatheringState) {
                        case "gathering":
                            println("Ice candidate gathering for sdp answer currently in progress");
                        case "complete":
                            complete = true;
                            println("Ice candidate gathering for sdp answer completed");
                    }
                });

                if (complete === true) {
                    const answer_msg = `{"type":"Relay","payload":"${answer}"}`;
                    console.log(answer_msg);
                    socket.send(answer_msg);
                }
            }
        }) // unhandled promise rejection type error
        
        // browser operates under a single thread of execution, cant loop and listen for events without blocking everything else
        // Need to use something like switch statements
        const onKeyDown = function ( event ) {
            
            switch ( event.code ) {

                case 'KeyW':
                    forward = true;
                    break;
                case 'KeyA':
                    left = true;
                    break;
                case 'KeyD':
                    right = true;
                    break;
                case 'KeyS':
                    back = true;
                    break;

            }
        };

        const onKeyUp = function ( event ) {
            
            switch ( event.code ) {
                
                case 'KeyW':
                    moveForward = false;
                    break;
                
                case 'KeyA':
                    moveLeft = false;
                    break;
                
                case 'KeyS':
                    moveBack = false;
                    break;
                
                case 'KeyD': 
                    moveRight = false;
                    break;
            }
        };

        document.addEventListener( 'keydown', onKeyDown)
        document.addEventListener( 'keyup', onKeyUp)
        
    </script>
